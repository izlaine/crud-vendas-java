<ui:composition template="/template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:ui="jakarta.faces.facelets"><ui:define name="content"><div class="card"><h2>Marcas</h2><h:form id="form"><p:commandButton value="Nova marca" icon="pi pi-plus" action="#{marcaController.novo}" update=":form" style="margin-bottom:15px"/><p:dataTable value="#{marcaController.marcas}" var="m" paginator="true" rows="10" filterEvent="enter"><p:column headerText="Nome" filterBy="#{m.nome}" sortBy="#{m.nome}">#{m.nome}</p:column><p:column headerText="Descrição">#{m.descricao}</p:column><p:column headerText="Ativo">#{m.ativo ? 'Sim':'Não'}</p:column><p:column headerText="Ações"><p:commandButton icon="pi pi-pencil" action="#{marcaController.editar(m)}" update=":form"/><p:commandButton icon="pi pi-trash" action="#{marcaController.excluir(m)}" update=":form" styleClass="ui-button-danger"><p:confirm header="Confirmação" message="Tem certeza que deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable><p:separator/><p:panel header="Cadastro"><p:panelGrid columns="2" layout="grid"><p:outputLabel for="nome" value="Nome *"/><p:inputText id="nome" value="#{marcaController.marca.nome}" required="true"/><p:outputLabel for="desc" value="Descrição"/><p:inputTextarea id="desc" value="#{marcaController.marca.descricao}"/><p:outputLabel for="ativo" value="Ativo"/><p:selectBooleanCheckbox id="ativo" value="#{marcaController.marca.ativo}"/></p:panelGrid><p:commandButton value="Salvar" action="#{marcaController.salvar}" update=":form :growl"/><p:commandButton value="Limpar" action="#{marcaController.novo}" update=":form" type="button"/></p:panel></h:form></div></ui:define></ui:composition>
