<ui:composition template="/template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><ui:define name="content"><div class="card"><h2>Categorias</h2><h:form id="form"><p:dataTable value="#{categoriaController.categorias}" var="c" paginator="true" rows="10"><p:column headerText="Categoria" filterBy="#{c.nome}" sortBy="#{c.nome}">#{categoriaController.indentacao(c)}</p:column><p:column headerText="Caminho hierárquico" sortBy="#{c.caminhoHierarquico}">#{c.caminhoHierarquico}</p:column><p:column headerText="Ações"><p:commandButton icon="pi pi-pencil" action="#{categoriaController.editar(c)}" update=":form"/><p:commandButton icon="pi pi-trash" action="#{categoriaController.excluir(c)}" update=":form :growl" styleClass="ui-button-danger"><p:confirm header="Confirmação" message="Tem certeza que deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable><p:separator/><p:panel header="Cadastro"><p:panelGrid columns="2" layout="grid"><p:outputLabel for="nome" value="Nome *"/><p:inputText id="nome" value="#{categoriaController.categoria.nome}" required="true"/><p:outputLabel for="pai" value="Categoria pai"/><p:selectOneMenu id="pai" value="#{categoriaController.categoria.categoriaPai}" converter="categoriaConverter"><f:selectItem itemLabel="-- Categoria raiz --" itemValue=""/><f:selectItems value="#{categoriaController.categoriasPais}" var="x" itemValue="#{x}" itemLabel="#{categoriaController.indentacao(x)}"/></p:selectOneMenu></p:panelGrid><p:commandButton value="Salvar" action="#{categoriaController.salvar}" update=":form :growl"/><p:commandButton value="Nova" action="#{categoriaController.novo}" update=":form"/></p:panel></h:form></div></ui:define></ui:composition>
