<ui:composition template="/template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><ui:define name="content"><div class="card"><h2>Produtos</h2><h:form id="form" enctype="multipart/form-data"><p:dataTable value="#{produtoController.produtos}" var="p" paginator="true" rows="10"><p:column headerText="Imagem"><p:graphicImage value="#{p.caminhoImagem}" width="70" height="70" rendered="#{not empty p.caminhoImagem}"/></p:column><p:column headerText="Nome" filterBy="#{p.nome}" sortBy="#{p.nome}">#{p.nome}</p:column><p:column headerText="Preço" sortBy="#{p.preco}"><h:outputText value="#{p.preco}"><f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/></h:outputText></p:column><p:column headerText="Estoque">#{p.quantidadeEstoque}</p:column><p:column headerText="Marca">#{p.marca.nome}</p:column><p:column headerText="Categoria">#{p.categoria.nome}</p:column><p:column headerText="Ações"><p:commandButton icon="pi pi-pencil" action="#{produtoController.editar(p)}" update=":form"/><p:commandButton icon="pi pi-trash" action="#{produtoController.excluir(p)}" update=":form :growl" styleClass="ui-button-danger"><p:confirm header="Confirmação" message="Tem certeza que deseja excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable><p:separator/><p:panel header="Cadastro / Edição"><p:panelGrid columns="2" layout="grid"><p:outputLabel for="nome" value="Nome *"/><p:inputText id="nome" value="#{produtoController.produto.nome}" required="true"/><p:outputLabel for="descricao" value="Descrição"/><p:inputTextarea id="descricao" value="#{produtoController.produto.descricao}"/><p:outputLabel for="preco" value="Preço *"/><p:inputNumber id="preco" value="#{produtoController.produto.preco}" decimalPlaces="2" symbol="R$ " symbolPosition="p" minValue="0.01"/><p:outputLabel for="estoque" value="Estoque *"/><p:inputNumber
